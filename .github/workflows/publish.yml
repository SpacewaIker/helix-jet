name: Publish plugin
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true

permissions:
  contents: write

jobs:
  natives:
    strategy:
      matrix:
        include:
          - { os: windows-latest, id: windows }
          - { os: ubuntu-latest,  id: linux }
          - { os: macos-latest,   id: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - run: ./gradlew buildGrammars
      - name: Stage native libs
        shell: bash
        run: |
          mkdir -p stage
          root="$PWD"
          find . -name 'ktreesitter-*.jar' -not -path './stage/*' | while read -r jar; do
            echo "Extracting lib/ from $jar"
            (cd stage && jar xf "$root/$jar" lib)
          done
          test -d stage/lib || { echo "No native libs found in any ktreesitter jar"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.id }}
          path: stage

  publish:
    needs: natives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          merge-multiple: true
          path: plugin/src/main/resources
      - name: Render release notes to HTML
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          RELEASE_BODY=$(gh release view "$TAG" --json body -q .body)
          gh api markdown -f mode=gfm -f text="$RELEASE_BODY" > notes.html
          {
            echo "CHANGE_NOTES<<__NOTES_EOF__"
            cat notes.html
            echo
            echo "__NOTES_EOF__"
          } >> "$GITHUB_ENV"
      - name: Publish to Marketplace
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: ./gradlew :plugin:publishPlugin -PpluginVersion=$(TAG)
      - name: Attached signed zip to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" plugin/build/distributions/plugin-*.zip --clobber
